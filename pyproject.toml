[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdforienter"
version = "0.1.0"
description = "Intelligent, parallel PDF page rotation correction."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "InfinitiBit GmbH" },
]
maintainers = [
    { name = "InfinitiBit GmbH" },
]
keywords = ["pdf", "rotation", "ocr", "tesseract", "document"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Utilities",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
    "Topic :: Text Processing",
]
dependencies = [
    "PyMuPDF>=1.23",
    "pytesseract>=0.3.10",
    "Pillow>=10.0",
    "psutil>=5.9",
]

[project.urls]
Homepage      = "https://github.com/MdRahmatUllah/pdforienter"
Repository    = "https://github.com/MdRahmatUllah/pdforienter"
Issues        = "https://github.com/MdRahmatUllah/pdforienter/issues"
Documentation = "https://github.com/MdRahmatUllah/pdforienter/blob/main/TECHNICAL.md"

[project.scripts]
pdforienter = "pdforienter.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pdforienter*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = true

[[tool.mypy.overrides]]
module = ["fitz", "pytesseract", "psutil", "PIL", "PIL.Image"]
ignore_missing_imports = true
